name: README check

# Keeps the auto-generated README sections in sync without pushing commits.
#
# This job deliberately does NOT commit. An earlier revision ran as
# github-actions[bot] and pushed directly to main, which added the bot as a
# repository contributor. Instead, the job regenerates the sections in place and
# fails with a diff if README.md is stale, so a human (or the PR author) commits
# the fix under their own name.
#
# Run `npm run readme:update` locally to apply the same regeneration.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "src/**"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-check:
    name: README sections up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate README sections
        run: node scripts/update-readme.mjs

      - name: Fail if README is stale
        run: |
          if ! git diff --quiet -- README.md; then
            echo "::error file=README.md::README.md is out of date."
            echo ""
            echo "The dependency list or folder structure changed but README.md was"
            echo "not regenerated. Fix it by running:"
            echo ""
            echo "    npm run readme:update"
            echo ""
            echo "then commit the updated README.md."
            echo ""
            echo "--- expected changes ---"
            git --no-pager diff -- README.md
            exit 1
          fi
          echo "README.md is up to date."
