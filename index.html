<!doctype html>
<html lang="en">
  <head>
    <!-- UTF-8 Support -->
    <meta charset="UTF-8" />
    <!-- IE Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme Color -->
    <meta name="theme-color" content="#0f1923" />
    <!-- Description -->
    <meta
      name="description"
      content="A Valorant-inspired 3D animated gaming website built with React and GSAP"
    />
    <!-- Author -->
    <meta name="author" content="Sanidhya Kumar Verma" />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="reactjs, netlify, react, modern-ui, modern-ux, valorant, gsap, animated, animated-ui, game-website, gaming-website, tactical-shooter, postcss, prettier, tailwindcss, tailwindcss-animate, ui/ux, js, javascript, typescript, eslint, html, css, js, ts"
    />

    <!-- Icon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48 64x64"
    />
    <link rel="icon" type="image/png" href="/icon1.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon2.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180" />

    <!-- Warm up the two reels the hero mounts on first paint -->
    <link rel="preload" as="video" href="/videos/hero-1.mp4" type="video/mp4" />
    <link rel="preload" as="video" href="/videos/hero-2.mp4" type="video/mp4" />

    <!-- Title -->
    <title>Valorant | 3D Animated Gaming Website</title>
  </head>
  <body>
    <div id="root"></div>

    <noscript>Enable JavaScript to run this Vite.js application.</noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
